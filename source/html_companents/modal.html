<div class="modal">
  <div class="modal__container">
    <button class="modal__button button-close" type="button">
      <span class="visually-hidden">Закрыть</span>
    </button>
    <div class="modal__wrapper">
      <section class="discuss">
        <h2 class="discuss__title">Давайте обсудим ваш проект!</h2>
        <p class="discuss__text">Любую идея, любой масштаб<br> — я помогу воплотить в жизнь.</p>
      </section>
      <section class="form">
        <h2 class="visually-hidden">Раздел с формой</h2>
        <form class="form__modal" action="https://echo.htmlacademy.ru/" method="get">
          <ul class="form__list">
            <li class="form__item">
              <label class="form__label">
                <span class="form__label-text">Ваше имя*</span>
                <input class="form__field field-name" type="text" name="name" id="name" placeholder="ALEX" required>
              </label>
            </li>
            <li class="form__item">
              <label class="form__label">
                <span class="form__label-text">Telegram аккаунт*</span>
                <input class="form__field field-email" type="email" name="email" id="email" placeholder="@ALEX"
                  required>
              </label>
            </li>
            <li class="form__item">
              <label class="form__label">
                <span class="form__label-text">Сообщение*</span>
                <input class="form__field field-massage" type="text" name="massage" id="massage" placeholder="ALEX"
                  required>
              </label>
            </li>
          </ul>
          <label class="form__label form__label--checkbox">
            <input class="visually-hidden form__field field-checkbox" type="checkbox" name="personal__data"
              id="checkbox" checked>
            <span class="label-mark"></span>
            <span class="form__label-subtext">
              <b class="form__label-subtext-another">Я согласен с политикой </b>
              обработки
              персональных данных.</span>
          </label>
          <button class="form__button button" type="submit">
            <svg class="button__icon" width="255" height="50" viewBox="0 0 255 50" fill="none"
              xmlns="http://www.w3.org/2000/svg">
              <path
                d="M198 0C200.761 5.15405e-07 203 2.23858 203 5V12H205V5C205 2.23858 207.239 4.0266e-08 210 0H250C252.761 6.44256e-07 255 2.23858 255 5V45C255 47.7614 252.761 50 250 50H210C207.239 50 205 47.7614 205 45V38H203V45C203 47.7614 200.761 50 198 50H5C2.23858 50 4.02673e-08 47.7614 0 45V5C6.44277e-07 2.23858 2.23858 0 5 0H198ZM230 4C218.402 4 209 13.402 209 25C209 36.598 218.402 46 230 46C241.598 46 251 36.598 251 25C251 13.402 241.598 4 230 4Z"
                fill="white" />
              <text class="button__icon-text" x="60" y="30" font-family="Arial" font-size="14" fill="black">
                Отправить
              </text>
            </svg>
          </button>
        </form>
      </section>
      <section class="contacts-modal">
        <h2 class="visually-hidden">Контакты</h2>
        <p class="contacts-modal__text">
          Или свяжитесь со мной напрямую.
        </p>
        <ul class="contacts-modal__list">
          <li class="contacts-modal__item">
            <a class="contacts-modal__link contacts-modal__link--telegram" href="https://t.me/Alexsander_Du"
              target="_blank">Telegram
              <svg width="16" height="16">
                <use href="images/icons/sprite/icon.svg#tg_icon">
              </svg></a>
          </li>
          <li class=" contacts-modal__item">
            <a class="contacts-modal__link contacts-modal__link--mail" href="mailto:alexsander.du.customs@gmail.com"
              target="_blank">gmail
              <svg width="16" height="16">
                <use href="images/icons/sprite/icon.svg#email_icon">
              </svg></a>

          </li>
          <li class="contacts-modal__item">
            <a class="contacts-modal__link contacts-modal__link--phone" href="tel:+79892667328" target="_blank">Телефон
              <svg width="16" height="16">
                <use href="images/icons/sprite/icon.svg#phone_icon">
              </svg></a>

          </li>
        </ul>
      </section>
    </div>
  </div>
</div>
